
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conlang Quest — The Language Grimoire</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --paper:#e9d9b5;
  --brown:#382719;
  --gold:#b58a43;
  --green:#40553b;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:radial-gradient(ellipse at center,#59432e,#21170f);
  color:var(--brown);
  font-family:'Lora',serif;
  min-height:100vh;
}

header {
  text-align:center;
  padding:35px 15px 25px;
  color:#e3c77d;
  background:linear-gradient(180deg,#21170f,#382719);
  border-bottom:3px solid var(--gold);
}

header h1 {
  font-family:'Cinzel',serif;
  font-size:clamp(27px,5vw,43px);
  margin:8px 0;
  letter-spacing:3px;
}

header p {
  color:#d5c29d;
  font-style:italic;
}

.logo { font-size:35px; }

.container {
  max-width:1100px;
  margin:25px auto;
  padding:0 15px;
  display:grid;
  grid-template-columns:245px 1fr;
  gap:20px;
}

.panel {
  background:linear-gradient(135deg,#f3e5c5,#dfc99e);
  border:3px double #9a7139;
  border-radius:5px;
  padding:20px;
  box-shadow:0 8px 25px #0007;
  position:relative;
}

.panel::before {
  content:"";
  position:absolute;
  inset:5px;
  border:1px solid #b18b50;
  pointer-events:none;
}

h2,h3 { font-family:'Cinzel',serif; }

h2 {
  font-size:25px;
  border-bottom:2px solid #b18b50;
  padding-bottom:10px;
}

h3 { font-size:17px; }

.subtitle {
  color:#72583b;
  font-style:italic;
}

nav {
  display:grid;
  gap:9px;
}

.nav-button {
  background:linear-gradient(#74502f,#49301d);
  color:#f4dfad;
  border:2px solid #a98243;
  padding:12px;
  font-family:'Cinzel',serif;
  cursor:pointer;
  text-align:left;
  border-radius:3px;
  font-size:13px;
}

.nav-button:hover,
.nav-button.active {
  background:linear-gradient(#a17a40,#70502c);
  color:white;
}

.nav-button:disabled {
  opacity:.4;
  cursor:not-allowed;
}

.progress {
  height:10px;
  background:#9e8966;
  margin:12px 0;
  border:1px solid #70502c;
}

.progress-fill {
  height:100%;
  width:0;
  background:linear-gradient(90deg,#75834b,#c6a34e);
  transition:width .3s;
}

button,input,select,textarea {
  font-family:'Lora',serif;
}

.action {
  background:linear-gradient(#80603b,#51351f);
  border:2px solid #ae8747;
  color:#f9e8bc;
  padding:11px 17px;
  cursor:pointer;
  border-radius:3px;
  font-weight:bold;
}

.action:hover {
  background:linear-gradient(#a27a43,#74502c);
}

.secondary {
  background:#e0cda6;
  color:#49301d;
}

input,select,textarea {
  width:100%;
  padding:10px;
  border:1px solid #9d7c4c;
  background:#f8edcf;
  color:#382719;
  border-radius:3px;
  font-size:15px;
}

label {
  display:block;
  margin:12px 0 5px;
  font-weight:bold;
}

.lesson {
  background:#e2d0a9;
  border-left:4px solid #a17a40;
  padding:15px;
  margin:18px 0;
  line-height:1.7;
}

.phonemes {
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin:18px 0;
}

.phoneme {
  background:#f7eacb;
  border:2px solid #a17a40;
  color:#382719;
  min-width:55px;
  padding:10px;
  cursor:pointer;
  font-size:19px;
  border-radius:3px;
}

.phoneme.selected {
  background:#687348;
  color:white;
  border-color:#39472b;
}

.sound-row {
  display:flex;
  align-items:center;
  gap:9px;
  margin:8px 0;
}

.sound-info {
  flex:1;
  font-size:13px;
}

.audio-button {
  background:#66502f;
  color:white;
  border:1px solid #bd9654;
  padding:8px 12px;
  cursor:pointer;
}

.word-list {
  display:grid;
  gap:10px;
}

.word {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:10px;
  background:#f5e7c5;
  border:1px solid #b18b50;
  overflow-wrap:anywhere;
}

.notice {
  padding:12px;
  background:#dce4c5;
  border:1px solid #72804e;
  margin-top:15px;
  display:none;
}

.notice.show { display:block; }

.grid2 {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.tabs {
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:18px;
}

.tab {
  padding:9px 13px;
  background:#74502f;
  color:#f4dfad;
  border:1px solid #a98243;
  cursor:pointer;
}

.tab.active {
  background:#a17a40;
  color:white;
}

.separator {
  border:0;
  border-top:1px solid #b18b50;
  margin:18px 0;
}

.tag {
  display:inline-block;
  background:#687348;
  color:white;
  padding:4px 9px;
  font-size:12px;
  margin:3px;
}

footer {
  text-align:center;
  color:#d5c29d;
  padding:25px;
}

@media(max-width:750px) {
  .container { grid-template-columns:1fr; }
  .grid2 { grid-template-columns:1fr; }
}
</style>
</head>

<body>

<header>
  <div class="logo">✦ ⚜ ✦</div>
  <h1>CONLANG QUEST</h1>
  <p>The Language Grimoire — Crie sua própria língua</p>
</header>

<div class="container">

<aside>
  <div class="panel">
    <h3>📜 Sua Jornada</h3>
    <div class="progress">
      <div class="progress-fill" id="progress"></div>
    </div>
    <small id="progressText">0 de 6 níveis</small>

    <hr class="separator">

    <nav id="navigation"></nav>

    <hr class="separator">

    <button class="action secondary" id="resetBtn">
      Reiniciar jornada
    </button>
  </div>
</aside>

<main class="panel" id="gamePanel"></main>

</div>

<footer>
  ✦ Conlang Quest · The Language Grimoire ✦
</footer>

<script>

const LEVELS = [
  "Os Sons",
  "O Alfabeto",
  "As Palavras",
  "Ordem das Frases",
  "Gramática",
  "Primeira Conversa"
];

const IPA = {
  a:"Vogal aberta anterior não arredondada",
  e:"Vogal média-fechada anterior não arredondada",
  i:"Vogal fechada anterior não arredondada",
  o:"Vogal média-fechada posterior arredondada",
  u:"Vogal fechada posterior arredondada",
  p:"Oclusiva bilabial surda",
  b:"Oclusiva bilabial sonora",
  t:"Oclusiva alveolar surda",
  d:"Oclusiva alveolar sonora",
  k:"Oclusiva velar surda",
  g:"Oclusiva velar sonora",
  m:"Nasal bilabial",
  n:"Nasal alveolar",
  s:"Fricativa alveolar surda",
  z:"Fricativa alveolar sonora",
  f:"Fricativa labiodental surda",
  v:"Fricativa labiodental sonora",
  l:"Aproximante lateral alveolar",
  r:"Vibrante alveolar",
  "ʃ":"Fricativa pós-alveolar surda",
  "ʒ":"Fricativa pós-alveolar sonora",
  h:"Fricativa glotal surda",
  j:"Aproximante palatal",
  w:"Aproximante labiovelar",
  "ŋ":"Nasal velar",
  "ɲ":"Nasal palatal"
};

const DEFAULT = {
  name:"Minha Língua",
  sounds:["a","i","u","m","n","k","t","s"],
  letters:{},
  words:{},
  completed:[],
  order:"SVO",
  plural:"Sufixo",
  question:"Partícula no início",
  example:"",
  translation:"",
  freeWords:{}
};

let state;

try {
  state = {
    ...DEFAULT,
    ...JSON.parse(localStorage.getItem("conlangQuestSave") || "{}")
  };
} catch {
  state = {...DEFAULT};
}

state.letters ||= {};
state.words ||= {};
state.freeWords ||= {};
state.completed ||= [];
state.sounds ||= [...DEFAULT.sounds];

let current=0;
let tab="overview";

const $ = id => document.getElementById(id);

function save() {
  localStorage.setItem("conlangQuestSave",JSON.stringify(state));
}

function esc(value) {
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  })[c]);
}

function speak(symbol) {
  if(!window.speechSynthesis) {
    alert("Seu navegador não suporta síntese de voz.");
    return;
  }

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(symbol);
  utterance.lang="pt-BR";
  utterance.rate=0.65;

  speechSynthesis.speak(utterance);
}

function renderNavigation() {
  let html=LEVELS.map((name,i)=>{
    let locked=i>0 && !state.completed.includes(i-1);

    return `
      <button class="nav-button ${current===i?"active":""}"
        data-level="${i}" ${locked?"disabled":""}>
        ${state.completed.includes(i)?"✓":"✦"}
        ${i+1}. ${name}
      </button>`;
  }).join("");

  html+=`
    <button class="nav-button ${current===6?"active":""}"
      data-level="6" ${state.completed.length<6?"disabled":""}>
      ∞ Modo Livre
    </button>

    <button class="nav-button ${current===7?"active":""}"
      data-level="7">
      📖 Minha Língua
    </button>`;

  $("navigation").innerHTML=html;

  document.querySelectorAll("[data-level]").forEach(button=>{
    button.onclick=()=>{
      current=Number(button.dataset.level);
      render();
    };
  });

  $("progress").style.width=
    (state.completed.length/6*100)+"%";

  $("progressText").textContent=
    `${state.completed.length} de 6 níveis concluídos`;
}

function renderSounds() {
  let sounds=Object.keys(IPA);

  return `
    <p>Escolha os sons que sua língua utilizará.
    Clique nos símbolos para selecioná-los.</p>

    <div class="phonemes">
      ${sounds.map(s=>`
        <button class="phoneme ${state.sounds.includes(s)?"selected":""}"
          data-sound="${s}">
          ${s}
        </button>
      `).join("")}
    </div>

    <h3>🔊 Ouvir os sons</h3>

    <p class="subtitle">
      Demonstrações aproximadas usando a voz do navegador.
      A pronúncia pode variar.
    </p>

    <div id="soundList">
      ${state.sounds.map(s=>`
        <div class="sound-row">
          <strong style="font-size:24px;width:40px">/${s}/</strong>
          <div class="sound-info">${IPA[s]||"Som personalizado"}</div>
          <button class="audio-button" data-audio="${s}">
            ▶ Ouvir
          </button>
        </div>
      `).join("")}
    </div>

    <p class="subtitle">
      Sons selecionados: ${state.sounds.length}
    </p>
  `;
}

function renderAlphabet() {
  return `
    <p>Escolha como cada som será escrito.
    Você pode utilizar letras, combinações ou símbolos especiais.</p>

    ${state.sounds.map(s=>`
      <label>Som /${s}/</label>
      <input data-letter="${s}"
        value="${esc(state.letters[s]||s)}"
        maxlength="12"
        placeholder="Representação escrita">
    `).join("")}
  `;
}

function renderWords() {
  const concepts=[
    "sol","lua","água","fogo",
    "eu","você","casa","ver"
  ];

  return `
    <p>Crie palavras para os conceitos abaixo.</p>

    ${concepts.map(c=>`
      <label>${c}</label>
      <input data-word="${c}"
        value="${esc(state.words[c]||"")}"
        placeholder="Palavra na sua língua">
    `).join("")}
  `;
}

function renderGrammar() {
  return `
    <label>Ordem das palavras</label>
    <select id="order">
      ${["SVO","SOV","VSO","VOS","OSV","OVS"].map(o=>
        `<option ${state.order===o?"selected":""}>${o}</option>`
      ).join("")}
    </select>

    <label>Como funciona o plural?</label>
    <select id="plural">
      ${["Sufixo","Prefixo","Palavra separada","Sem plural","Regra própria"].map(o=>
        `<option ${state.plural===o?"selected":""}>${o}</option>`
      ).join("")}
    </select>

    <label>Como fazer perguntas?</label>
    <select id="question">
      ${["Partícula no início","Partícula no fim","Entonação","Palavra interrogativa","Regra própria"].map(o=>
        `<option ${state.question===o?"selected":""}>${o}</option>`
      ).join("")}
    </select>
  `;
}

function renderConversation() {
  return `
    <label>Frase na sua língua</label>
    <textarea id="example" rows="3">${esc(state.example)}</textarea>

    <label>Tradução</label>
    <input id="translation" value="${esc(state.translation)}"
      placeholder="O significado da frase">

    <p class="subtitle">
      Parabéns! Você está criando sua primeira frase.
    </p>
  `;
}

function renderSummary() {
  return `
    <h2>📖 ${esc(state.name)}</h2>

    <label>Nome da sua língua</label>
    <input id="languageName" value="${esc(state.name)}">

    <div class="tabs">
      <button class="tab active" data-tab="overview">Visão geral</button>
      <button class="tab" data-tab="sounds">Sons</button>
      <button class="tab" data-tab="alphabet">Alfabeto</button>
      <button class="tab" data-tab="words">Dicionário</button>
      <button class="tab" data-tab="grammar">Gramática</button>
      <button class="tab" data-tab="phrases">Frases</button>
    </div>

    <div id="summaryContent"></div>
  `;
}

function renderSummaryTab() {
  let content=$("summaryContent");

  if(tab==="overview") {
    content.innerHTML=`
      <h3>✨ Informações gerais</h3>
      <p>Nome: <strong>${esc(state.name)}</strong></p>
      <p>Níveis concluídos: ${state.completed.length}/6</p>
      <p>Sons: ${state.sounds.length}</p>
      <p>Palavras: ${
        Object.values(state.words).filter(Boolean).length+
        Object.values(state.freeWords).filter(Boolean).length
      }</p>
      <p>Ordem: ${esc(state.order)}</p>
      <p>Plural: ${esc(state.plural)}</p>
      <p>Perguntas: ${esc(state.question)}</p>
    `;
  }

  if(tab==="sounds") {
    content.innerHTML=`
      <h3>Inventário de sons</h3>
      ${state.sounds.map(s=>`<span class="tag">/${esc(s)}/</span>`).join("")}
    `;
  }

  if(tab==="alphabet") {
    content.innerHTML=`
      <h3>Alfabeto</h3>
      ${state.sounds.map(s=>`
        <div class="word">
          <strong>/${esc(s)}/</strong>
          <span>${esc(state.letters[s]||s)}</span>
        </div>
      `).join("")}
    `;
  }

  if(tab==="words") {
    let words={...state.words,...state.freeWords};

    content.innerHTML=`
      <h3>Dicionário</h3>
      ${Object.entries(words).filter(([k,v])=>v).map(([k,v])=>`
        <div class="word">
          <strong>${esc(k)}</strong>
          <span>${esc(v)}</span>
        </div>
      `).join("")||"Seu dicionário ainda está vazio."}
    `;
  }

  if(tab==="grammar") {
    content.innerHTML=`
      <h3>Regras gramaticais</h3>
      <p>Ordem: ${esc(state.order)}</p>
      <p>Plural: ${esc(state.plural)}</p>
      <p>Perguntas: ${esc(state.question)}</p>
    `;
  }

  if(tab==="phrases") {
    content.innerHTML=`
      <h3>Frases criadas</h3>
      <p>${esc(state.example||"Nenhuma frase ainda.")}</p>
      <p><em>${esc(state.translation)}</em></p>
    `;
  }
}

function renderFree() {
  return `
    <h2>✦ Modo Livre</h2>
    <p class="subtitle">
      Agora você é o mestre da sua própria língua!
    </p>

    <div class="lesson">
      Não existem missões obrigatórias aqui.
      Crie palavras, experimente sons e invente suas próprias regras.
    </div>

    <h3>Adicionar palavra</h3>

    <label>Significado</label>
    <input id="freeMeaning" placeholder="Ex.: estrela">

    <label>Palavra na sua língua</label>
    <input id="freeWord" placeholder="Ex.: eluna">

    <button class="action" id="addWord">Adicionar</button>

    <hr class="separator">

    <h3>Seu dicionário</h3>
    <div id="freeDictionary"></div>
  `;
}

function updateFreeDictionary() {
  $("freeDictionary").innerHTML=
    Object.entries(state.freeWords).map(([meaning,word])=>`
      <div class="word">
        <strong>${esc(meaning)}</strong>
        <span>${esc(word)}</span>
      </div>
    `).join("") || "Nenhuma palavra criada ainda.";
}

function render() {
  renderNavigation();

  let panel=$("gamePanel");

  if(current===7) {
    panel.innerHTML=renderSummary();
    renderSummaryTab();

    $("languageName").oninput=e=>{
      state.name=e.target.value;
      save();
    };

    document.querySelectorAll("[data-tab]").forEach(b=>{
      b.onclick=()=>{
        tab=b.dataset.tab;
        document.querySelectorAll("[data-tab]").forEach(x=>
          x.classList.toggle("active",x===b)
        );
        renderSummaryTab();
      };
    });

    return;
  }

  if(current===6) {
    panel.innerHTML=renderFree();
    updateFreeDictionary();

    $("addWord").onclick=()=>{
      let meaning=$("freeMeaning").value.trim();
      let word=$("freeWord").value.trim();

      if(!meaning||!word) {
        alert("Preencha os dois campos!");
        return;
      }

      state.freeWords[meaning]=word;
      save();
      updateFreeDictionary();

      $("freeMeaning").value="";
      $("freeWord").value="";
    };

    return;
  }

  const bodies=[
    renderSounds(),
    renderAlphabet(),
    renderWords(),
    renderGrammar(),
    renderGrammar(),
    renderConversation()
  ];

  const descriptions=[
    "Escolha os sons que existirão na sua língua.",
    "Crie seu próprio sistema de escrita.",
    "Comece a construir seu vocabulário.",
    "Decida como as frases serão organizadas.",
    "Crie as regras da sua gramática.",
    "Combine tudo e crie uma frase."
  ];

  const lessons=[
    "Toda língua possui sons. Escolha os que deseja utilizar.",
    "Um som pode ter várias representações escritas. Seja criativo!",
    "Invente palavras para os conceitos apresentados.",
    "SVO significa Sujeito, Verbo e Objeto. Outras ordens também são possíveis.",
    "As regras gramaticais dão estrutura à sua língua.",
    "Escreva uma frase e sua tradução."
  ];

  panel.innerHTML=`
    <small>✦ NÍVEL ${current+1} DE 6 ✦</small>
    <h2>${LEVELS[current]}</h2>
    <p class="subtitle">${descriptions[current]}</p>

    <div class="lesson">${lessons[current]}</div>

    ${bodies[current]}

    <div class="notice" id="notice"></div>

    <hr class="separator">

    <button class="action" id="complete">
      ${state.completed.includes(current)?"Concluído ✓":"Concluir nível →"}
    </button>
  `;

  document.querySelectorAll("[data-sound]").forEach(b=>{
    b.onclick=()=>{
      const s=b.dataset.sound;

      state.sounds=state.sounds.includes(s)
        ?state.sounds.filter(x=>x!==s)
        :[...state.sounds,s];

      save();
      render();
    };
  });

  document.querySelectorAll("[data-audio]").forEach(b=>{
    b.onclick=()=>speak(b.dataset.audio);
  });

  document.querySelectorAll("[data-letter]").forEach(input=>{
    input.oninput=()=>{
      state.letters[input.dataset.letter]=input.value;
      save();
    };
  });

  document.querySelectorAll("[data-word]").forEach(input=>{
    input.oninput=()=>{
      state.words[input.dataset.word]=input.value;
      save();
    };
  });

  ["order","plural","question","example","translation"].forEach(id=>{
    const element=$(id);
    if(element) {
      element.oninput=()=>{
        state[id]=element.value;
        save();
      };
  }
  });

  $("complete").onclick=completeLevel;
}

function completeLevel() {
  let valid=true;
  let message="";

  if(current===0 && state.sounds.length<5) {
    valid=false;
    message="Escolha pelo menos 5 sons.";
  }

  if(current===1 && state.sounds.filter(s=>
    (state.letters[s]||s).trim()
  ).length<5) {
    valid=false;
    message="Personalize pelo menos 5 sons.";
  }

  if(current===2 && Object.values(state.words).filter(v=>
    String(v).trim()
  ).length<5) {
    valid=false;
    message="Crie pelo menos 5 palavras.";
  }

  if(current===5 &&
    (!state.example.trim()||!state.translation.trim())) {
    valid=false;
    message="Escreva uma frase e sua tradução.";
  }

  if(!valid) {
    $("notice").textContent=message;
    $("notice").classList.add("show");
    return;
  }

  if(!state.completed.includes(current)) {
    state.completed.push(current);
  }

  save();

  if(current<5) {
    current++;
  } else {
    current=6;
  }

  render();
}

$("resetBtn").onclick=()=>{
  if(confirm("Deseja apagar seu progresso?")) {
    localStorage.removeItem("conlangQuestSave");
    location.reload();
  }
};

render();

</script>
</body>
</html>
